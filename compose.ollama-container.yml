# Container-ollama override: runs ollama as a docker service alongside
# api/db. The api auto-pulls the configured model on first boot (see
# main.py lifespan).
#
# Activated by setting in .env:
#   COMPOSE_FILE=docker-compose.yml:compose.ollama-container.yml
#
# On Windows with an NVIDIA GPU, layer the GPU override on top:
#   COMPOSE_FILE=docker-compose.yml:compose.ollama-container.yml:docker-compose.gpu.yml
# Verify with: docker compose exec ollama nvidia-smi
#
# Models persist in the named volume across rebuilds.

services:
  api:
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  ollama_data:
