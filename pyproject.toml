[project]
name = "gb-automations"
version = "0.1.0"
description = "Goldbox automation hub: Notion as the single source of truth for Gmail, Frame, Toggl, Fiken, and more."
authors = [
    { name = "cs-tobias", email = "tobias@cinesuit.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "apscheduler>=3.11.2",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "google-api-python-client>=2.196.0",
    "google-auth>=2.52.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.1",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.46.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
