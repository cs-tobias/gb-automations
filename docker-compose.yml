# Base stack. Whether ollama runs in-container or natively on the host is
# controlled by which override file Compose layers on top of this one —
# selected by COMPOSE_FILE in .env (the single OLLAMA_MODE switch).
#
#   compose.ollama-native.yml     → no ollama service; api → host.docker.internal:11434
#   compose.ollama-container.yml  → ollama service runs;  api → ollama:11434
#
# Compose reads COMPOSE_FILE from .env automatically and treats it as
# "-f <a> -f <b>" — so the user only edits one line in .env.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gb}
      POSTGRES_DB: ${POSTGRES_DB:-gb}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gb} -d ${POSTGRES_DB:-gb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Cloudflare Tunnel: exposes the api service to the public internet at
  # https://hub.tobiaseek.com. Requires CLOUDFLARE_TUNNEL_TOKEN in .env.
  # If the token is empty (e.g. brand-new clone before setup), the container
  # will crash-loop visibly — that's intentional, signals "you forgot to
  # configure the tunnel". To skip starting it for purely-local dev, run:
  #   docker compose up -d --scale cloudflared=0
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
