services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gb}
      POSTGRES_DB: ${POSTGRES_DB:-gb}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gb} -d ${POSTGRES_DB:-gb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Cloudflare Tunnel: exposes the api service to the public internet at
  # https://hub.tobiaseek.com. Requires CLOUDFLARE_TUNNEL_TOKEN in .env.
  # If the token is empty (e.g. brand-new clone before setup), the container
  # will crash-loop visibly — that's intentional, signals "you forgot to
  # configure the tunnel". To skip starting it for purely-local dev, run:
  #   docker compose up -d --scale cloudflared=0
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    restart: unless-stopped

  # Local LLM (Ollama).
  #
  # Runs by default — `docker compose up -d` starts it alongside api/db. This
  # is the cross-platform baseline: a Windows or Linux box only needs Docker.
  # The api auto-pulls the configured model on first boot (see main.py
  # lifespan), so no manual `pull_llm_model` step is required.
  #
  # On Windows with an NVIDIA GPU, layer the GPU override:
  #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
  # Verify with: docker compose exec ollama nvidia-smi
  #
  # Mac dev opt-out (for native Metal acceleration): set
  # OLLAMA_BASE_URL=http://host.docker.internal:11434 in .env, run
  # `OLLAMA_HOST=0.0.0.0:11434 ollama serve` natively, then stop the
  # in-container service with `docker compose stop ollama` so it doesn't
  # waste ~5GB of disk and idle RAM.
  #
  # Models persist in the named volume across rebuilds.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  db_data:
  ollama_data:
