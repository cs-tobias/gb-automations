services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    # Ollama always runs natively on the host (Mac dev, Windows prod) for
    # hardware acceleration — never in a container. host.docker.internal
    # resolves to the host on Docker Desktop for both macOS and Windows.
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    ports:
      - "8000:8000"
    volumes:
      - ./secrets:/app/secrets:ro
      # Office NAS (the shared W: drive). Mounted as a CIFS volume managed by
      # Docker itself — see the `nas` volume definition below. This works on
      # both Linux hosts and Windows Docker Desktop with the WSL2 backend
      # (where binding a Windows-mapped drive letter or UNC path does NOT
      # work — see docs/misc/gotchas.md §15).
      # Disabled on dev boxes without the NAS reachable: the volume requires
      # NAS_CIFS_DEVICE/NAS_USER/NAS_PASS in .env (compose drops it with
      # "missing device in volume options" otherwise). Re-enable on the
      # office host where the share is reachable; pair with SYNC_NAS_FOLDERS
      # in .env (the app code respects that flag independently).
      # - nas:/mnt/nas:rw
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gb}
      POSTGRES_DB: ${POSTGRES_DB:-gb}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gb} -d ${POSTGRES_DB:-gb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Cloudflare Tunnel: exposes the api service to the public internet at
  # https://hub.tobiaseek.com. Requires CLOUDFLARE_TUNNEL_TOKEN in .env.
  # If the token is empty (e.g. brand-new clone before setup), the container
  # will crash-loop visibly — that's intentional, signals "you forgot to
  # configure the tunnel". To skip starting it for purely-local dev, run:
  #   docker compose up -d --scale cloudflared=0
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
  # Office NAS, mounted by Docker as a CIFS volume. The api container sees
  # this at /mnt/nas (see the bind above). Docker mounts named volumes
  # lazily — the CIFS mount only happens when a container starts using the
  # volume, so a misconfigured share causes the api container to fail to
  # start with a mount error (the green-log-line check in main.py never
  # gets reached). nas_available() in clients/nas.py is the runtime check
  # for an already-mounted-but-unwritable share.
  #
  # NAS_CIFS_DEVICE — UNC path with forward slashes, no smb:// prefix, e.g.
  #   //192.168.1.200/filserver/gb-automations-test
  # NAS_USER / NAS_PASS — credentials for the share.
  # uid=999,gid=999 matches the container's `app` user (see Dockerfile) so
  # writes don't hit the classic CIFS uid-mismatch failure (gotchas §15).
  # vers=3.0 is the modern SMB dialect; drop to 2.0 if the NAS only speaks
  # SMB2. On Windows Docker Desktop WSL2 backend, the docker-desktop distro
  # needs cifs-utils installed once (see docs/misc/nas-setup.md).
  #
  # No-NAS dev: set NAS_CIFS_DEVICE to a local path you control, e.g.
  #   NAS_CIFS_DEVICE=//host.docker.internal/ShareName
  # or comment out the `- nas:/mnt/nas:rw` line in `api.volumes` above (the
  # app boots without it; only the NAS sync step degrades to nas:failed).
  nas:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${NAS_USER:-},password=${NAS_PASS:-},uid=999,gid=999,file_mode=0664,dir_mode=0775,vers=3.0"
      device: "${NAS_CIFS_DEVICE:-}"
