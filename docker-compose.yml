services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    # Ollama always runs natively on the host (Mac dev, Windows prod) for
    # hardware acceleration — never in a container. host.docker.internal
    # resolves to the host on Docker Desktop for both macOS and Windows.
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    ports:
      - "8000:8000"
    volumes:
      - ./secrets:/app/secrets:ro
      # Office NAS (the shared W: drive). Bound in prod via
      # docker-compose.prod.yml, which prod opts into by setting
      # COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml in its .env.
      # Not bound here so a dev box without NAS reachable still boots with
      # just `docker compose up -d` (no flags, no override needed). See
      # docs/misc/nas-setup.md for the prod setup and docs/misc/gotchas.md
      # §15 for why CIFS-volume instead of a Windows-drive bind.
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gb}
      POSTGRES_DB: ${POSTGRES_DB:-gb}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gb} -d ${POSTGRES_DB:-gb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Cloudflare Tunnel: exposes the api service to the public internet at
  # https://hub.tobiaseek.com. Requires CLOUDFLARE_TUNNEL_TOKEN in .env.
  # If the token is empty (e.g. brand-new clone before setup), the container
  # will crash-loop visibly — that's intentional, signals "you forgot to
  # configure the tunnel". To skip starting it for purely-local dev, run:
  #   docker compose up -d --scale cloudflared=0
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
  # Office NAS, mounted by Docker as a CIFS volume. Declared here so the
  # prod overlay (docker-compose.prod.yml) can reference it by name without
  # redefining the driver_opts. Docker mounts named volumes lazily — the
  # CIFS mount only happens when a container starts using the volume (i.e.
  # only in prod, where docker-compose.prod.yml adds the bind to api). On
  # dev where the overlay isn't active, the volume is declared but never
  # mounted into anything, so the empty NAS_CIFS_DEVICE is harmless.
  # nas_available() in clients/nas.py is the runtime check for an
  # already-mounted-but-unwritable share.
  #
  # NAS_CIFS_DEVICE — UNC path with forward slashes, no smb:// prefix, e.g.
  #   //192.168.1.200/filserver/gb-automations-test
  # NAS_USER / NAS_PASS — credentials for the share.
  # uid=999,gid=999 matches the container's `app` user (see Dockerfile) so
  # writes don't hit the classic CIFS uid-mismatch failure (gotchas §15).
  # vers=3.0 is the modern SMB dialect; drop to 2.0 if the NAS only speaks
  # SMB2. On Windows Docker Desktop WSL2 backend, the docker-desktop distro
  # needs cifs-utils installed once (see docs/misc/nas-setup.md).
  nas:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${NAS_USER:-},password=${NAS_PASS:-},uid=999,gid=999,file_mode=0664,dir_mode=0775,vers=3.0"
      device: "${NAS_CIFS_DEVICE:-}"
