services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gb}
      POSTGRES_DB: ${POSTGRES_DB:-gb}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gb} -d ${POSTGRES_DB:-gb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Cloudflare Tunnel: exposes the api service to the public internet at
  # https://hub.tobiaseek.com. Requires CLOUDFLARE_TUNNEL_TOKEN in .env.
  # If the token is empty (e.g. brand-new clone before setup), the container
  # will crash-loop visibly — that's intentional, signals "you forgot to
  # configure the tunnel". To skip starting it for purely-local dev, run:
  #   docker compose up -d --scale cloudflared=0
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    restart: unless-stopped

  # Local LLM (Ollama).
  #
  # Behind the `ollama` profile so it does NOT start on `docker compose up`
  # by default. On Mac dev we run Ollama natively (brew install ollama) for
  # Metal acceleration and point the api at http://host.docker.internal:11434.
  # That setup is faster than CPU-in-docker and is the permanent dev shape.
  #
  # On Windows prod with an NVIDIA GPU, enable the profile + layer the GPU
  # override:
  #   docker compose --profile ollama -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
  # And set OLLAMA_BASE_URL=http://ollama:11434 in .env so the api container
  # talks to the in-stack ollama service instead of the (non-existent on
  # Windows) host install.
  #
  # Models are pulled into the named volume so they survive rebuilds — run
  # `docker compose exec api python -m gb_automations.scripts.pull_llm_model`
  # once after first start.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  db_data:
  ollama_data:
