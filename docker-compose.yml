# Single switch lives in .env: COMPOSE_PROFILES.
#   COMPOSE_PROFILES=          (empty) → native: no ollama container; the api
#                                        talks to a host-native `ollama serve`
#                                        at host.docker.internal:11434.
#   COMPOSE_PROFILES=container         → the ollama service below starts and
#                                        the api talks to it at ollama:11434.
# The api's OLLAMA_BASE_URL is derived from that one var via OLLAMA_HOST in
# .env (self-interpolation), so there is nothing else to change. We avoid
# COMPOSE_FILE for this because its list separator differs by OS (":" on
# mac/linux, ";" on Windows) — COMPOSE_PROFILES is a portable comma-list.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # OLLAMA_HOST defaults to host.docker.internal (native); .env sets it to
      # "ollama" when COMPOSE_PROFILES=container. See .env for the derivation.
      OLLAMA_BASE_URL: "http://${OLLAMA_HOST:-host.docker.internal}:11434"
    ports:
      - "8000:8000"
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
        required: false
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gb}
      POSTGRES_DB: ${POSTGRES_DB:-gb}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gb} -d ${POSTGRES_DB:-gb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Cloudflare Tunnel: exposes the api service to the public internet at
  # https://hub.tobiaseek.com. Requires CLOUDFLARE_TUNNEL_TOKEN in .env.
  # If the token is empty (e.g. brand-new clone before setup), the container
  # will crash-loop visibly — that's intentional, signals "you forgot to
  # configure the tunnel". To skip starting it for purely-local dev, run:
  #   docker compose up -d --scale cloudflared=0
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    restart: unless-stopped

  # Local LLM (Ollama) — only starts when COMPOSE_PROFILES=container.
  # The api auto-pulls the configured model on first boot (see main.py
  # lifespan). Models persist in the named volume across rebuilds.
  #
  # On Windows with an NVIDIA GPU, layer the GPU override:
  #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
  # Verify with: docker compose exec ollama nvidia-smi
  ollama:
    image: ollama/ollama:latest
    profiles: ["container"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  db_data:
  ollama_data:
